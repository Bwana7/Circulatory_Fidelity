[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circulatory-fidelity"
version = "1.1.0"
description = "A prior predictive diagnostic for mean-field variational inference"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anonymous"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["variational inference", "mean-field", "diagnostics", "Bayesian", "hierarchical models"]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "jupyter>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Bwana7/Circulatory_Fidelity"
"Bug Tracker" = "https://github.com/Bwana7/Circulatory_Fidelity/issues"

[tool.setuptools.packages.find]
where = ["src/python"]
